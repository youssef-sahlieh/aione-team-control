name = "aione-team-control"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Only reachable on the custom domain, which Cloudflare Access protects.
# The free *.workers.dev address and preview URLs are turned off so nothing bypasses sign-in.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "team.aione.host", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker checks sign-in before any file is served.
run_worker_first = true
not_found_handling = "none"

[vars]
# Who may use the app (comma separated). Must match the Cloudflare Access policy.
ALLOWED_EMAILS = "youssef@aione.biz,ellen@aione.biz"
# Your Zero Trust team domain, e.g. "aione.cloudflareaccess.com" (Zero Trust > Settings > Custom Pages / Team domain).
TEAM_DOMAIN = "REPLACE_WITH_TEAM_NAME.cloudflareaccess.com"
# Application Audience (AUD) tag from Zero Trust > Access > Applications > your app > Overview.
POLICY_AUD = "REPLACE_WITH_AUD_TAG"
