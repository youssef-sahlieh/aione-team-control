<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://aione-team-proxy.vercel.app; form-action 'none'; base-uri 'self'">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>AIONE Team Control</title>
<link rel="icon" type="image/png" href="assets/brand/aione-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles/tokens.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="auth" id="view-signin" hidden>
  <div class="card"><div class="band"></div><div class="cbody">
    <div class="mark"><img class="brand-logo logo-on-light" src="assets/brand/aione-logo.png" alt="AIONE, all in one business solutions" width="240" height="48"><img class="brand-logo logo-on-dark" src="assets/brand/aione-logo-light.png" alt="AIONE, all in one business solutions" width="240" height="48"><span class="mark-name">Team Control</span></div>
    <h1>Sign in</h1>
    <form id="signin-form" novalidate>
      <div class="field"><label for="email">Work email</label><input class="input" id="email" type="email" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
      <p class="msg err" id="signin-msg" role="alert" hidden></p>
      <button class="btn primary" id="signin-btn" type="submit">Sign in</button>
      <div class="row"><button class="link" id="forgot-link" type="button">Forgot password?</button></div>
    </form>
  </div><div class="foot">Only approved AIONE team members can open this app.</div></div>
</main>

<main class="auth" id="view-forgot" hidden>
  <div class="card"><div class="band"></div><div class="cbody">
    <div class="mark"><img class="brand-logo logo-on-light" src="assets/brand/aione-logo.png" alt="AIONE, all in one business solutions" width="240" height="48"><img class="brand-logo logo-on-dark" src="assets/brand/aione-logo-light.png" alt="AIONE, all in one business solutions" width="240" height="48"><span class="mark-name">Team Control</span></div>
    <h1>Reset your password</h1>
    <p class="lead">Enter your work email. If it has an account, we'll email you a link to choose a new password.</p>
    <form id="forgot-form" novalidate>
      <div class="field"><label for="forgot-email">Work email</label><input class="input" id="forgot-email" type="email" autocomplete="username" required></div>
      <p class="msg" id="forgot-msg" role="status" hidden></p>
      <button class="btn primary" id="forgot-btn" type="submit">Send reset link</button>
      <div class="row"><button class="link" id="back-link" type="button">Back to sign in</button></div>
    </form>
  </div></div>
</main>


<script src="assets/config.js"></script>
<script type="module" src="assets/signin.js"></script>
</body>
</html>
