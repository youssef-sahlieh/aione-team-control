<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://aione-team-proxy.vercel.app; form-action 'none'; base-uri 'self'">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Odoo knowledge base · AION Team Control</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/dashboard.css">
<link rel="stylesheet" href="assets/styles/mobile.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Odoo knowledge base</h1>
      <div class="sub">Locked with a password that administrators set. Customer logins are kept inside Odoo.</div>
    </div>
    <span class="db-top-actions">
      <a class="btn" href="dashboard.html">← Dashboard</a>
      <span class="me"><span>Signed in as <b id="me">…</b></span> <button class="btn" id="signout" type="button">Sign out</button></span>
    </span>
  </div>

  <div id="state" class="state">Loading…</div>

  <section class="blk" id="unlock-block" hidden>
    <h2>Unlock</h2>
    <p class="msg" id="unlock-help">Enter the password your administrator set. It is not saved in this browser.</p>
    <form id="unlock-form" class="kb-form">
      <label class="business-field"><span>Password</span><input class="inp" id="unlock-password" type="password" autocomplete="off" required></label>
      <button class="btn primary" id="unlock-submit" type="submit">Unlock</button>
    </form>
    <p class="msg" id="unlock-msg" role="status"></p>
    <p id="kb-open-wrap" hidden><a class="btn primary" id="kb-open" target="_blank" rel="noopener">Open the Odoo knowledge base ↗</a></p>
  </section>

  <section class="blk" id="set-block" hidden>
    <h2>Set the password</h2>
    <p class="msg" id="set-help"></p>
    <form id="set-form" class="kb-form">
      <label class="business-field"><span>New password (8 to 200 characters)</span><input class="inp" id="set-password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label>
      <button class="btn primary" id="set-submit" type="submit">Save password</button>
    </form>
    <p class="msg" id="set-msg" role="status"></p>
  </section>
</div>

<script src="assets/config.js"></script>
<script type="module" src="assets/knowledge.js"></script>
</body>
</html>
