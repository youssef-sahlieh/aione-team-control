<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://aione-team-proxy.vercel.app; form-action 'none'; base-uri 'self'">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>Users · AION Team Control</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/dashboard.css">
<link rel="stylesheet" href="assets/styles/mobile.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Users</h1>
      <div class="sub">Who can sign in, and what they can see</div>
    </div>
    <a class="btn" href="dashboard.html">← Dashboard</a>
    <span class="me">Signed in as <b id="me">…</b> <button class="btn" id="signout" type="button">Sign out</button></span>
  </div>

  <div id="pagestate" class="state">Loading users…</div>

  <section class="upanel" id="list" hidden>
    <div class="utools">
      <h2>Everyone <span class="count" id="count"></span></h2>
      <input class="inp" id="search" type="search" placeholder="Search by name or email" aria-label="Search people" autocomplete="off">
      <select class="fsel" id="filter" aria-label="Show">
        <option value="all">Everyone</option>
        <option value="admin">Administrators</option>
        <option value="user">Users</option>
        <option value="pending">Invitation not used yet</option>
      </select>
      <button class="btn primary" id="invite" type="button">Invite someone</button>
    </div>
    <div class="ulist" id="rows"></div>
    <p class="msg" id="empty" hidden>No one matches your search.</p>
  </section>

  <section class="upanel" id="kb-pass" hidden>
    <h2>Knowledge base password</h2>
    <p class="uhelp" id="kb-help"></p>
    <form id="kb-form" class="utools">
      <input class="inp" id="kb-password" type="password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="New password (8 to 200 characters)" aria-label="New knowledge base password" required>
      <button class="btn primary" id="kb-submit" type="submit">Set password</button>
    </form>
    <p class="msg" id="kb-msg" role="status"></p>
  </section>
</div>

<dialog class="udialog" id="person" aria-labelledby="p-title">
  <form id="person-form" class="udform" novalidate>
    <h2 id="p-title">Invite someone</h2>
    <label class="ufield"><span>Name</span><input class="inp" id="p-name" autocomplete="off" required></label>
    <label class="ufield"><span>Work email</span><input class="inp" id="p-email" type="email" autocomplete="off" required></label>
    <div class="ufield"><span>Role</span>
      <div class="rolecards" role="group" aria-label="Role" id="p-role">
        <button type="button" class="rolecard" data-role="user" aria-pressed="true"><b>User</b><span>Sees the tickets for one developer. Can change status, set due dates and comment.</span></button>
        <button type="button" class="rolecard" data-role="admin" aria-pressed="false"><b>Administrator</b><span>Sees and changes everything, including this page.</span></button>
      </div>
    </div>
    <label class="ufield"><span id="p-devlabel">Sees the tickets for</span>
      <select class="fsel" id="p-dev"></select>
    </label>
    <label class="ufield" id="p-otherwrap" hidden><span>Developer name</span><input class="inp" id="p-other" placeholder="e.g. bashar.k" autocomplete="off"></label>

    <div class="ulink" id="p-link" hidden>
      <p>Email isn't set up, so send this link to them yourself (it works once, for 3 days):</p>
      <div class="inline"><input class="inp" id="p-linkval" readonly><button class="btn" id="p-copy" type="button">Copy link</button></div>
    </div>

    <div id="p-manage" hidden>
      <p class="uhelp" id="p-info"></p>
      <div class="inline">
        <button class="btn" id="p-reset" type="button">Send password reset</button>
        <button class="btn danger" id="p-remove" type="button">Remove</button>
      </div>
    </div>

    <div class="uactions">
      <span class="msg" id="p-msg" role="status"></span>
      <button class="btn" id="p-cancel" type="button">Cancel</button>
      <button class="btn primary" id="p-save" type="submit">Send invitation</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="assets/config.js"></script>
<script type="module" src="assets/users.js"></script>
</body>
</html>
