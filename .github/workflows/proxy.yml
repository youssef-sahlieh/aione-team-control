# Deploys the Jira proxy (worker/) to Cloudflare Workers when it changes, or when run by hand
# (Actions > Deploy Jira proxy > Run workflow), for example after changing a secret.
name: Deploy Jira proxy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/proxy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JIRA_EMAIL JIRA_API_TOKEN JIRA_SITE TEAM_PASSWORD SESSION_SECRET TEAM_CONFIG; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these under Settings > Secrets and variables > Actions:$missing (see SETUP.md)"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.140.0"
          workingDirectory: worker
          secrets: |
            TEAM_PASSWORD
            SESSION_SECRET
            TEAM_CONFIG
            JIRA_SITE
            JIRA_EMAIL
            JIRA_API_TOKEN
        env:
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
