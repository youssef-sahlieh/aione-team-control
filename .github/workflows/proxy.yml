# Deploys the Jira proxy (worker/) to Cloudflare Workers when it changes, or when run by hand
# (Actions > Deploy Jira proxy > Run workflow), for example after changing a secret.
name: Deploy Jira proxy

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/proxy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JIRA_EMAIL JIRA_API_TOKEN JIRA_SITE TEAM_PASSWORD SESSION_SECRET TEAM_CONFIG; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these under Settings > Secrets and variables > Actions:$missing (see SETUP.md)"
            exit 1
          fi
      - name: Deploy the proxy and its secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TEAM_CONFIG: ${{ secrets.TEAM_CONFIG }}
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Optional: email sending through Microsoft 365 (see SETUP.md, step 4).
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          npx --yes wrangler@4.140.0 deploy
          # Secrets that are set go to the proxy; the optional email ones are skipped when empty.
          node -e '
            const names = ["TEAM_PASSWORD","SESSION_SECRET","TEAM_CONFIG","JIRA_SITE","JIRA_EMAIL","JIRA_API_TOKEN","MS_TENANT_ID","MS_CLIENT_ID","MS_CLIENT_SECRET"];
            const out = {}; for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Setting secrets:", Object.keys(out).join(", "));
          '
          npx --yes wrangler@4.140.0 secret bulk secrets.json
          rm -f secrets.json
