# Publishes the dashboard (public/) to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix proxy
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:approvals -- --output=test-results/approvals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      # Version tags on every script and style, so browsers fetch the new files after each deploy.
      - name: Stamp files with this deploy's version
        if: github.event_name != 'pull_request'
        run: node scripts/stamp-assets.js public ${{ github.sha }}
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  wait-for-proxy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the existing Vercel Git deployment
        run: node scripts/wait-for-proxy.js

  # Cross-repository check: runs the AI1 Monitor SSO browser suite against the exact AI1 Monitor commit below.
  # Mark this job as a required status check in the branch protection rules for main.
  monitor-sso-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONITOR_REF: 9020a3137f406c3fdb1d7dcfba4b7075f6fb24f9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KAD-org/fileHostingService
          ref: ${{ env.MONITOR_REF }}
          token: ${{ secrets.MONITOR_REPO_TOKEN }}
          path: monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r test/monitor-sso-e2e/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Run the AI1 Monitor SSO browser suite
        env:
          AIONE_MONITOR_REPO: ${{ github.workspace }}/monitor
        run: |
          echo "AIONE_TEST_PYTHON=$(which python)" >> "$GITHUB_ENV"
          npm run test:e2e:monitor-sso
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monitor-sso-test-results
          path: test-results/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, wait-for-proxy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
